<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Siswa</title>
  <link rel="stylesheet" href="style/style.css" />
  <style>
    .table-container {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: max-content;
      border-collapse: collapse;
      min-width: 800px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
      white-space: nowrap;
    }

    tfoot td {
      font-weight: bold;
      background-color: #f9f9f9;
    }

    @media (max-width: 768px) {
      table {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-flex">
      <div class="logo">
        <img src="images/Logo.png" alt="Logo SDN Ciasmara" style="max-width: 80px;" />
      </div>
      <h1>Alumni SDN Ciasmara II</h1>
    </div>

    <h2>List Tabungan</h2>

    <div class="table-container">
      <table id="data-table">
        <thead></thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">Home</a>
    <a href="view.html" class="nav-item">Data Tabungan</a>
  </nav>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vToAuXPbEoxBSVi4_IYEhkGt85yVpyLPxTbsxrFbkdNg2OFhfpBTIX9dj7m5sBL5UcclSFcDGY2wiOU/pub?output=csv';

    fetch(sheetUrl)
      .then(response => response.text())
      .then(data => {
        const rows = data.trim().split('\n').map(row => row.split(','));
        const tableHead = document.querySelector('#data-table thead');
        const tableBody = document.querySelector('#data-table tbody');
        const tableFoot = document.querySelector('#data-table tfoot');

        let jumlahIndex = rows[0].findIndex(h => h.toLowerCase().includes('jumlah'));
        let total = 0;

        let headerHTML = '<tr>';
        rows[0].forEach(cell => headerHTML += `<th>${cell}</th>`);
        headerHTML += '</tr>';
        tableHead.innerHTML = headerHTML;

        rows.slice(1).forEach(row => {
          let rowHTML = '<tr>';
          row.forEach((cell, i) => {
            let value = cell;
            if (i === jumlahIndex) {
              const number = parseInt(cell.replace(/[^\d]/g, '')) || 0;
              total += number;
              value = formatNumber(number);
            }
            rowHTML += `<td>${value}</td>`;
          });
          rowHTML += '</tr>';
          tableBody.innerHTML += rowHTML;
        });

        if (jumlahIndex >= 0) {
          let footHTML = '<tr>';
          rows[0].forEach((_, i) => {
            if (i === jumlahIndex) {
              footHTML += `<td>Total: ${formatNumber(total)}</td>`;
            } else {
              footHTML += '<td></td>';
            }
          });
          footHTML += '</tr>';
          tableFoot.innerHTML = footHTML;
        }
      });

    function formatNumber(num) {
      return num.toLocaleString('id-ID');
    }
  </script>
</body>
</html>
