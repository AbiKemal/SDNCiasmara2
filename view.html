<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Siswa</title>
  <link rel="stylesheet" href="style/style.css">
  <style>
    .table-container {
      overflow-x: auto;
    }
    table th:nth-child(1),
    table th:nth-child(2),
    table th:nth-child(3),
    table td:nth-child(1),
    table td:nth-child(2),
    table td:nth-child(3) {
      min-width: 120px;
    }
    tfoot td {
      font-weight: bold;
      background-color: #f9f9f9;
    }
  </style>
<style>
  .table-container {
    overflow-x: auto;
    width: 100%;
  }

  table {
    width: max-content;
    border-collapse: collapse;
  }

  table th, table td {
    padding: 8px;
    border: 1px solid #ccc;
    white-space: nowrap;
  }
</style>
  
</head>
<body>
  <div class="container">
    <div class="header-flex">
      <div class="logo">
        <img src="images/Logo.png" alt="Logo SDN Ciasmara" style="max-width: 80px;" />
      </div>
      <h1>Alumni SDN Ciasmara II</h1>
    </div>

    <h2>List Tabungan</h2>

    
    <div class="table-container">
      <table id="data-table">
        <thead></thead>
        <tbody></tbody>
        <tfoot></tfoot>
      </table>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">Home</a>
    <a href="view.html" class="nav-item">Data Tabungan</a>
  </nav>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vToAuXPbEoxBSVi4_IYEhkGt85yVpyLPxTbsxrFbkdNg2OFhfpBTIX9dj7m5sBL5UcclSFcDGY2wiOU/pub?output=csv';

    fetch(sheetUrl)
      .then(response => response.text())
      .then(data => {
        const rows = data.trim().split('\n').map(row => row.split(','));
        const tableHead = document.querySelector('#data-table thead');
        const tableBody = document.querySelector('#data-table tbody');
        const tableFoot = document.querySelector('#data-table tfoot');

        let jumlahIndex = rows[0].findIndex(h => h.toLowerCase().includes('jumlah'));
        let total = 0;

        // Header
        let headerHTML = '<tr>';
        rows[0].forEach(cell => {
          headerHTML += `<th>${cell}</th>`;
        });
        headerHTML += '</tr>';
        tableHead.innerHTML = headerHTML;

        // Isi
        rows.slice(1).forEach(row => {
          let rowHTML = '<tr>';
          row.forEach((cell, i) => {
            let value = cell;
            if (i === jumlahIndex) {
              const number = parseInt(cell.replace(/[^\d]/g, '')) || 0;
              total += number;
              value = formatNumber(number);
            }
            rowHTML += `<td data-label="${rows[0][i]}">${value}</td>`;
          });
          rowHTML += '</tr>';
          tableBody.innerHTML += rowHTML;
        });

        // Footer (Total)
        if (jumlahIndex >= 0) {
          let footHTML = '<tr>';
          rows[0].forEach((_, i) => {
            if (i === jumlahIndex) {
              footHTML += `<td data-label="Total">Total: ${formatNumber(total)}</td>`;
            } else {
              footHTML += '<td></td>';
            }
          });
          footHTML += '</tr>';
          tableFoot.innerHTML = footHTML;
        }
      });

    function formatNumber(num) {
      return num.toLocaleString('id-ID');
    }
  </script>
</body>
</html>
